<style>
/* ============ RESET & BASE ============ */
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {

/* ============ APP CONTAINER ============ */

/* ============ ANIMS ============ */

@keyframes bounce { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-10px); } 40% { transform: translateX(10px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes pop { 0% { transform: scale(0.85); opacity: 0; } 60% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }

.screen-title { font-size: 1.1rem; font-weight: 900; color: #fff; text-shadow: 2px 2px 0 #1A535C; }

/* ============ HOME ============ */

}
.home-subtitle { text-align: center; color: #fff; font-size: 1rem; margin-bottom: 2rem; text-shadow: 2px 2px 0 #1A535C; font-weight: 700; }
.home-buttons { display: flex; flex-direction: column; gap: 1.2rem; padding: 1.5rem 0.3rem; }

.home-footer { text-align: center; color: #fff; font-weight: 700; text-shadow: 1px 1px 0 #1A535C; opacity: 0.8; margin-top: 2rem; font-size: 0.85rem; }

.choice-btn:not(:disabled):active { transform: translateY(2px); box-shadow: 0 2px 0 rgba(0,0,0,0.15); }
.choice-btn.correct { background: #52BE80; color: white !important; border-color: #3A9960; animation: bounce 0.5s ease; }
.choice-btn.wrong { background: #FF6B6B; color: white !important; border-color: #C23B3B; animation: shake 0.4s ease; }
.choice-btn.dimmed { opacity: 0.32; }

.action-row { display: flex; gap: 0.4rem; padding: 0.3rem 0.1rem 0.2rem; animation: pop 0.3s ease; }
.action-row button { flex: 1; border: none; border-radius: 14px; padding: 0.75rem; font-weight: 900; font-size: 0.95rem; cursor: pointer; color: white; }
.action-row .speak-btn { background: #4ECDC4; box-shadow: 0 4px 0 #2BA39B; }
.action-row .speak-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #2BA39B; }
.action-row .next-btn { background: #FF6B6B; box-shadow: 0 4px 0 #C23B3B; flex: 1.3; }
.action-row .next-btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #C23B3B; }

.feedback-mark { text-align: center; font-size: 1.3rem; font-weight: 900; margin-top: 0.3rem; animation: pop 0.4s ease; }
.feedback-mark.ok { color: #fff; text-shadow: 2px 2px 0 #3A9960; }
.feedback-mark.ng { color: #fff; text-shadow: 2px 2px 0 #C23B3B; }

/* ============ COMBO OVERLAY ============ */
.combo-overlay {
  position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;

@keyframes comboPop {

/* ============ NEAR-MISS / PERFECT ============ */
.near-miss-msg { font-weight: 900; font-size: 1rem; padding: 0.6rem 1rem; border-radius: 14px; text-align: center; margin: 0.5rem 0; animation: pop 0.4s ease; }

/* ============ RESULT ============ */

<script>
/* ============================================================
 * MoWISE WiseGame Bridge v1.0 (2026-07-10)
 * 各ゲームに埋め込み、iframe親(MoWISE portal)へスコアを送信する。
 * 契約: src/lib/game-sdk.ts (source:'mowise-game',
 *       GAME_READY / GAME_SCORE / GAME_COMPLETE / GAME_EXIT)
 * スタンドアロン起動時(親なし)は何もしない=単体でも安全。
 * ============================================================ */
(function () {
  if (window.WiseGame) return;

  window.WiseGame = {
    gameId: null,
    _ctx: {},

    init: function (config) {
      config = config || {};
      if (config.gameId) this.gameId = config.gameId;
      this._send('GAME_READY', { gameId: this.gameId, version: config.version || '1.0' });
    },

    reportScore: function (data) {
      this._send('GAME_SCORE', this._merge(data));
    },

    reportComplete: function (data) {
      var payload = this._merge(data);
      payload.completed = true;
      this._send('GAME_COMPLETE', payload);
    },

    exit: function () {
      this._send('GAME_EXIT', { gameId: this.gameId });
    },

    _merge: function (data) {
      var out = { gameId: this.gameId };
      var k;
      for (k in this._ctx) out[k] = this._ctx[k];
      for (k in (data || {})) out[k] = data[k];
      return out;
    },

    _send: function (type, payload) {
      try {
        if (window.parent !== window) {
          window.parent.postMessage(
            { type: type, payload: payload, source: 'mowise-game' }, '*'
          );
        }
      } catch (e) {}
    }
  };

  window.addEventListener('message', function (e) {
    if (e.data && e.data.source === 'mowise-parent' && e.data.type === 'INIT_GAME') {
      var p = e.data.payload || {};
      if (p.gameId) window.WiseGame.gameId = p.gameId;
      window.WiseGame._ctx = { assignmentId: p.assignmentId, classId: p.classId };
    }
  });
})();

window.WiseGame.init({ gameId: 'wh-questiongame' });
</script>

<script>

// 疑問詞ルール解説(不正解時に表示)
const WH_RULES = {
  what:      '答えが「モノ・コト」のときは <b>What</b>(何)を使うよ',
  who:       '答えが「人」のときは <b>Who</b>(だれ)を使うよ',

  when:      '答えが「時・日にち」のときは <b>When</b>(いつ)を使うよ',

  how:       '答えが「方法・様子」のときは <b>How</b>(どうやって)を使うよ',
  how_long:  '答えが「期間(for two hours など)」のときは <b>How long</b>(どのくらいの間)だよ',
  how_much:  '答えが「値段・量(数えられないもの)」のときは <b>How much</b>(いくら/どのくらい)だよ',
  how_many:  '答えが「数(数えられるもの)」のときは <b>How many</b>(いくつ)だよ',
  how_often: '答えが「頻度(every day など)」のときは <b>How often</b>(どのくらいよく)だよ',
  how_old:   '答えが「年齢」のときは <b>How old</b>(何歳)だよ',
  which:     '「どっち/どれ」と選ぶときは <b>Which</b> を使うよ',
  whose:     '答えが「〜のもの(所有)」のときは <b>Whose</b>(だれの)だよ',
};

const QUESTION_WORDS = [
  { id: 'what',      en: 'What',      ja: 'なに / もの',               color: '#FF6B6B', shadow: '#C23B3B' },
  { id: 'who',       en: 'Who',       ja: 'だれ / ひと',               color: '#4ECDC4', shadow: '#2BA39B' },
  { id: 'where',     en: 'Where',     ja: 'どこ / ばしょ',             color: '#45B7D1', shadow: '#2887A0' },
  { id: 'when',      en: 'When',      ja: 'いつ / じかん',             color: '#FFA07A', shadow: '#CC7F5C' },
  { id: 'why',       en: 'Why',       ja: 'なぜ / りゆう',             color: '#98D8C8', shadow: '#6FB3A1' },
  { id: 'how',       en: 'How',       ja: 'どう / ほうほう',           color: '#F39C12', shadow: '#B87209' },

// ==========================================
// localStorage PERSISTENCE
// ==========================================
const STORAGE_KEY = 'wh_quiz_data';

function loadSavedData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return { totalGames: 0, totalCorrect: 0, totalAnswered: 0, bestScore: 0, wrongAnswers: [] };
}

function saveData(data) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (e) {}
}

function recordGameResult(score, total) {
  const data = loadSavedData();
  data.totalGames++;
  data.totalCorrect += score;
  data.totalAnswered += total;
  if (score > data.bestScore) data.bestScore = score;
  saveData(data);
}

function recordWrongAnswer(question, chosenWord) {
  const data = loadSavedData();
  const entry = {
    questionId: question.id,
    exQ: question.exQ,
    answer: question.answer,
    correctWord: question.correct,
    chosenWord: chosenWord,
    timestamp: Date.now(),
  };
  data.wrongAnswers.push(entry);
  // Keep only the last 200 wrong answers
  if (data.wrongAnswers.length > 200) data.wrongAnswers = data.wrongAnswers.slice(-200);
  saveData(data);
}

// ==========================================
// SOUND EFFECTS (Web Audio API)
// ==========================================
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playCorrectSound() {
  try {
    const ctx = getAudioCtx();
    const freqs = [523.25, 659.25, 783.99]; // C-E-G chime
    freqs.forEach((freq, i) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      gain.gain.value = 0.2;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const startTime = ctx.currentTime + i * 0.1;
      osc.start(startTime);
      gain.gain.setValueAtTime(0.2, startTime);
      gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.3);
      osc.stop(startTime + 0.3);
    });
  } catch (e) {}
}

function playWrongSound() {
  try {
    const ctx = getAudioCtx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(150, ctx.currentTime);
    osc.frequency.linearRampToValueAtTime(100, ctx.currentTime + 0.2);
    gain.gain.setValueAtTime(0.3, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.2);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.2);
  } catch (e) {}
}

// ==========================================
// AUDIO - Google TTS (primary) + Web Speech API (fallback)
// ==========================================
let webVoice = null;
function initWebVoice() {
  if (!('speechSynthesis' in window)) return;
  const voices = speechSynthesis.getVoices();
  webVoice =
    voices.find(v => v.name.includes('Google') && v.lang.startsWith('en-US')) ||
    voices.find(v => v.lang === 'en-US') ||
    voices.find(v => v.lang === 'en-GB') ||
    voices.find(v => v.lang.startsWith('en')) ||
    null;
}
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = initWebVoice;
  initWebVoice();
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

let currentAudio = null;
function stopAudio() {
  try {
    if (currentAudio) { currentAudio.pause(); currentAudio.src = ''; currentAudio = null; }
    if ('speechSynthesis' in window) speechSynthesis.cancel();
  } catch (e) {}
}

function playGoogleTTS(text) {
  return new Promise((resolve, reject) => {
    try {
      const url = `https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(text)}&tl=en&client=tw-ob`;
      const audio = new Audio(url);
      currentAudio = audio;
      audio.onended = () => { if (currentAudio === audio) currentAudio = null; resolve(); };
      audio.onerror = () => reject(new Error('Google TTS failed'));
      audio.play().catch(reject);
    } catch (e) { reject(e); }
  });
}

function playWebSpeech(text) {
  return new Promise((resolve) => {
    if (!('speechSynthesis' in window)) return resolve();
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.92;
    u.pitch = 1.05;
    if (webVoice) u.voice = webVoice;
    u.onend = resolve;
    u.onerror = resolve;
    speechSynthesis.speak(u);
  });
}

async function speak(text) {
  stopAudio();
  try { await playGoogleTTS(text); }
  catch { await playWebSpeech(text); }
}

async function speakQA(qText, aText) {
  stopAudio();
  try { await playGoogleTTS(qText); } catch { await playWebSpeech(qText); }
  await sleep(500);
  try { await playGoogleTTS(aText); } catch { await playWebSpeech(aText); }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function countByWord(wid) { return QUESTIONS.filter(q => q.correct === wid).length; }
function getWordInfo(id) { return QUESTION_WORDS.find(w => w.id === id); }

  // Auto-speak the question word when entering intro card
  setTimeout(() => speak(word.en), 300);

  document.getElementById('btn-home').onclick = () => goto('home');
  document.getElementById('play-word').onclick = () => speak(word.en);
  document.querySelectorAll('.play-ex').forEach(btn => {
    btn.onclick = () => {
      const i = parseInt(btn.dataset.i);
      const ex = examples[i];
      speakQA(ex.q, ex.a);
    };
  });
  document.getElementById('prev').onclick = () => { if (state.introIdx > 0) { state.introIdx--; render(); } };
  document.getElementById('next').onclick = () => { if (state.introIdx < QUESTION_WORDS.length - 1) { state.introIdx++; render(); } };
}

// ==========================================
// SETUP
// ==========================================
function renderSetup(app) {
  const poolSize = [...state.selected].reduce((s, w) => s + countByWord(w), 0);
  const canStart = state.selected.size >= 2 && poolSize >= 4;
  app.innerHTML = `
    <div class="screen">
      <div class="top-nav">
        <button class="back-home-btn" id="btn-home">🏠 ホーム</button>
        <div class="screen-title">クイズ設定</div>
        <div class="nav-spacer"></div>
      </div>
      <p class="setup-desc">
        ✅ 出題する疑問詞を選んでください<br>
        <small>（2種類以上を選択 / 1セット${QUIZ_LENGTH}問出題）</small>
      </p>
      <div class="setup-actions-top">
        <button class="mini-btn" id="select-all">✅ 全て選択</button>
        <button class="mini-btn" id="select-basic">📖 基本6種</button>
        <button class="mini-btn" id="deselect-all">⬜ 解除</button>
      </div>
      <div class="word-grid">
        ${QUESTION_WORDS.map(w => `
          <div class="word-card ${state.selected.has(w.id) ? 'selected' : ''}"
               data-id="${w.id}" style="--word-color: ${w.color}">
            <div class="check">✅</div>
            <div class="en">${w.en}</div>
            <div class="ja">${w.ja}</div>
            <div class="count">${countByWord(w.id)}問</div>
          </div>
        `).join('')}
      </div>
      <div class="setup-status">
        選択中: ${state.selected.size}種類 / 合計 ${poolSize}問
      </div>
      <button class="start-btn" id="start" ${canStart ? '' : 'disabled'}>🎮 クイズスタート！</button>
    </div>
  `;
  document.getElementById('btn-home').onclick = () => goto('home');
  document.querySelectorAll('.word-card').forEach(card => {
    card.onclick = () => {
      const id = card.dataset.id;
      if (state.selected.has(id)) state.selected.delete(id); else state.selected.add(id);
      render();
    };
  });
  document.getElementById('select-all').onclick = () => { QUESTION_WORDS.forEach(w => state.selected.add(w.id)); render(); };
  document.getElementById('select-basic').onclick = () => { state.selected = new Set(['what','who','where','when','why','how']); render(); };
  document.getElementById('deselect-all').onclick = () => { state.selected.clear(); render(); };
  document.getElementById('start').onclick = () => { if (canStart) startQuiz(); };
}

function startQuiz() {
  const pool = QUESTIONS.filter(q => state.selected.has(q.correct));
  const shuffled = shuffle(pool);
  const count = Math.min(QUIZ_LENGTH, shuffled.length);
  state.quiz = {
    questions: shuffled.slice(0, count),
    idx: 0, score: 0, answered: false, wasCorrect: false,
    availableWords: [...state.selected],
    combo: 0, maxCombo: 0,
  };
  goto('quiz');
}

// ==========================================
// QUIZ (compact, 1-screen layout)
// ==========================================
function renderQuiz(app) {
  const { questions, idx, score, answered, wasCorrect, availableWords } = state.quiz;
  const q = questions[idx];
  const correctWord = getWordInfo(q.correct);
  const gridClass = availableWords.length > 6 ? 'choice-grid cols-3' : 'choice-grid';

  app.innerHTML = `
    <div class="screen">
      <div class="quiz-header">
        <button class="back-home-btn" id="btn-home">🏠</button>
        <div class="quiz-progress">📋 ${idx + 1} / ${questions.length}</div>
        <div class="quiz-score">⭐ ${score}</div>
      </div>

      <div class="visual-card">
        <div class="visual-inner" style="--grad1: ${q.grad[0]}; --grad2: ${q.grad[1]}">
          <div class="visual-emoji">${q.emoji}</div>
          <img class="visual-img"
               src="${esc(primaryImageUrl(q))}"
               data-fallback="${esc(fallbackImageUrl(q))}"
               alt=""
               referrerpolicy="no-referrer"
               onload="this.classList.add('loaded')"
               onerror="if(!this.dataset.fell){this.dataset.fell=1;this.classList.remove('loaded');this.src=this.dataset.fallback;}else{this.remove();}" />
        </div>
        ${answered ? `
          <div class="qa-display" style="--word-color: ${correctWord.color}">
            <span class="qa-q">Q: ${q.exQ}</span>
            <span class="qa-a">A: ${q.answer}</span>
          </div>
        ` : `
          <div class="answer-label">ANSWER / 答え</div>
          <div class="answer-text">${q.answer}</div>
        `}
      </div>

      <div class="${gridClass}">
        ${availableWords.map(wid => {
          const w = getWordInfo(wid);
          let cls = 'choice-btn';
          if (answered) {
            if (wid === q.correct) cls += ' correct';
            else cls += ' dimmed';
          }
          return `<button class="${cls}" data-word="${wid}"
                    style="--word-color: ${w.color}"
                    ${answered ? 'disabled' : ''}>
                    ${w.en}
                  </button>`;
        }).join('')}
      </div>

      ${answered ? `
        <div class="feedback-mark ${wasCorrect ? 'ok' : 'ng'}">
          ${wasCorrect ? '🎉 Great!' : '😢 Oops!'}
        </div>
        ${!wasCorrect && state.quiz.lastExplanation ? `
        <div style="margin:0.4rem auto 0; max-width:520px; background:rgba(255,255,255,0.92); color:#333;
                    border-radius:12px; padding:0.55rem 0.9rem; font-size:0.92rem; line-height:1.5;
                    border:2px solid #FFD166; text-align:center;">
          💡 ${state.quiz.lastExplanation}
        </div>` : ''}
        <div class="action-row">
          <button class="speak-btn" id="speak">🔊 もう一度</button>
          <button class="next-btn" id="next">${idx + 1 === questions.length ? '結果へ ▶' : '次の問題 ▶'}</button>
        </div>
      ` : ''}
    </div>
  `;

  // Auto-speak the answer text when a new question appears
  if (!answered) {
    setTimeout(() => speak(q.answer), 300);
  }

  document.getElementById('btn-home').onclick = () => {
    if (confirm('ホームに戻りますか？\n進行中のクイズは終了します。')) goto('home');
  };

  if (!answered) {
    document.querySelectorAll('.choice-btn').forEach(btn => {
      btn.onclick = () => handleAnswer(btn.dataset.word, btn);
    });
  } else {
    document.getElementById('speak').onclick = () => speakQA(q.exQ, q.answer);
    document.getElementById('next').onclick = () => {
      stopAudio();
      if (state.quiz.idx + 1 < state.quiz.questions.length) {
        state.quiz.idx++;
        state.quiz.answered = false;
        render();
      } else {
        goto('result');
      }
    };
  }
}

function showComboOverlay(text) {
  const existing = document.querySelector('.combo-overlay');
  if (existing) existing.remove();
  const el = document.createElement('div');
  el.className = 'combo-overlay';
  el.textContent = text;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function handleAnswer(chosen, btn) {
  const q = state.quiz.questions[state.quiz.idx];
  const isCorrect = chosen === q.correct;
  state.quiz.wasCorrect = isCorrect;
  if (isCorrect) {
    state.quiz.score++;
    state.quiz.combo++;
    if (state.quiz.combo > state.quiz.maxCombo) state.quiz.maxCombo = state.quiz.combo;
    playCorrectSound();
    const milestones = { 3: 'NICE! 🔥', 5: 'GREAT! ⚡', 7: 'AMAZING! 🌟', 10: 'UNSTOPPABLE! 💥' };
    if (milestones[state.quiz.combo]) showComboOverlay(milestones[state.quiz.combo]);
  } else {
    state.quiz.combo = 0;
    playWrongSound();
    recordWrongAnswer(q, chosen);
    state.quiz.lastExplanation = WH_RULES[q.correct] || '';
    // WiseXP: report wrong answer
    if(window.WiseXP) window.WiseXP.reportWrong({question:q.exQ, correct:q.correct, playerAnswer:chosen});
  }
  btn.classList.add(isCorrect ? 'correct' : 'wrong');

  // Auto-play Q → pause → A
  setTimeout(() => speakQA(q.exQ, q.answer), 350);

  // Reveal feedback (compact, stays on 1 screen)
  setTimeout(() => {
    state.quiz.answered = true;
    render();
  }, isCorrect ? 650 : 900);
}

// ==========================================
// RESULT
// ==========================================
function renderResult(app) {
  const { score, questions } = state.quiz;
  const total = questions.length;
  const pct = Math.round((score / total) * 100);
  let emoji, title, comment;
  if (pct === 100)     { emoji = '🏆'; title = 'Perfect!';     comment = '全問正解！すばらしい！'; }
  else if (pct >= 80)  { emoji = '🌟'; title = 'Great!';       comment = 'よくできました！'; }
  else if (pct >= 60)  { emoji = '👍'; title = 'Good!';        comment = 'いい感じ！その調子！'; }
  else if (pct >= 40)  { emoji = '💪'; title = 'Keep going!';  comment = 'もう少し！頑張ろう！'; }
  else                 { emoji = '📖'; title = "Let's learn!"; comment = '導入からもう一度見てみよう！'; }

  // WiseXP: report game result
  if(window.WiseXP) window.WiseXP.reportGame({score:pct, correct:score, total:total, maxCombo:0, grade:''});

  // → MoWISE portal へスコア送信 (WiseGame Bridge)
  try {
    const whTagMap = {What:'wh_what',Who:'wh_who',Where:'wh_where',When:'wh_when',Why:'wh_why',How:'wh_how',Whom:'wh_who',Whose:'wh_who'};
    const rawWrong = (loadSavedData().wrongAnswers || []).slice(-20);
    const wrongAnswers = rawWrong.map(w => ({
      q: w.exQ || w.questionId, correct: w.correctWord, chosen: w.chosenWord,
      tag: whTagMap[w.correctWord] || 'other_grammar'
    }));
    window.WiseGame && window.WiseGame.reportComplete({
      score: pct, maxScore: 100, accuracy: pct,
      timeSpent: Math.round((Date.now() - (window.__wiseStartTime || Date.now())) / 1000),
      metadata: { correct: score, total: total, wrongAnswers: wrongAnswers }
    });
  } catch(e) {}

  // Save this game result
  recordGameResult(score, total);
  const saved = loadSavedData();
  const lifetimePct = saved.totalAnswered > 0 ? Math.round((saved.totalCorrect / saved.totalAnswered) * 100) : 0;

  // TTS: announce result
  setTimeout(() => speak(pct === 100 ? 'Perfect! Great job!' : `${title} You got ${score} out of ${total}.`), 400);

  app.innerHTML = `
    <div class="screen">
      <div class="top-nav">
        <button class="back-home-btn" id="btn-home">🏠 ホーム</button>
        <div class="screen-title">🎊 結果発表</div>
        <div class="nav-spacer"></div>
      </div>
      <div class="result-card">
        <div class="result-emoji">${emoji}</div>
        <div class="result-title">${title}</div>
        <div class="result-score">${score}<span class="result-score-total"> / ${total}</span></div>
        <div class="result-score-pct">${pct}% 正解</div>
        <div class="result-comment">${comment}</div>
      ${pct === 100 ? '<div class="near-miss-msg perfect">PERFECT! 💎</div>' :
        pct >= 80 ? `<div class="near-miss-msg near">あと${total - score}問でパーフェクト！もう一回？</div>` : ''}
        <div class="result-stats">
          累計: ${saved.totalGames}回プレイ / 正答率 ${lifetimePct}% / ベスト ${saved.bestScore}点
        </div>
      </div>
      <div class="result-actions">
        <button class="again" id="again">🎮 もう一度クイズ (同じ設定)</button>
        <button class="setup-again" id="setup-again">⚙️ 疑問詞を選び直す</button>
        <button class="home" id="home">🏠 ホームへ戻る</button>
      </div>
    </div>
  `;
  document.getElementById('again').onclick = () => startQuiz();
  document.getElementById('setup-again').onclick = () => goto('setup');
  document.getElementById('home').onclick = () => goto('home');
  document.getElementById('btn-home').onclick = () => goto('home');
}

// ==========================================
// INIT
// ==========================================
document.addEventListener('click', function primeAudio() {
  try {
    if ('speechSynthesis' in window) {
      const u = new SpeechSynthesisUtterance('');
      speechSynthesis.speak(u);
    }
    const silentAudio = new Audio();
    silentAudio.play().catch(() => {});
    // Prime Web Audio API context
    getAudioCtx();
  } catch (e) {}
  document.removeEventListener('click', primeAudio);
}, { once: true });

render();

// WiseXP SDK init
if(window.WiseXP) window.WiseXP.init('wh-questiongame');
</script>
<script src="https://cdn.jsdelivr.net/gh/winniek75/wise-xp-sdk@main/wise-xp.js"></script>
</body>
